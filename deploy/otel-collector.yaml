# OpenTelemetry Collector：平台三个进程唯一认识的可观测性地址。
#
# **加这一跳的理由不是转发，是解耦**：api / worker / broker 只知道
# `OTEL_ENDPOINT`，不知道背后是 Tempo 还是别的。换后端、加采样、脱敏，
# 都在这个文件里改，应用侧一行不动、一次不重启。

receivers:
  otlp:
    protocols:
      # 平台三个进程走 HTTP。选它而不是 gRPC，是因为 Python 侧的 HTTP 导出器
      # 依赖更少 —— 少装一个 grpcio 就少一处要跟着 Python 版本升级的二进制轮子
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 攒一批再发。一次分析产生几十上百个 span，逐个转发等于把网络往返
  # 乘上 span 数量
  batch:
    timeout: 5s

  # **护栏**：Collector 自己被 span 压垮时先丢新数据，而不是 OOM 掉整个容器 ——
  # 后者会连带把已经收下、还没转出去的那批也弄丢
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64

exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      # memory_limiter 必须排在 batch 前面：先挡住，再攒
      processors: [memory_limiter, batch]
      exporters: [otlp]
