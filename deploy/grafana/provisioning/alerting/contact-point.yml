# 告警投给谁：飞书自定义机器人（P4 计划 §7.3）。
#
# **webhook 地址是凭据**，因此这里只写变量名，实际值从仓库根的 `.env` 经 env_file
# 进到 Grafana 的进程环境里。Grafana 会展开 provisioning 文件里的 `$VAR`。
#
# **不能用默认的 webhook 正文。** Grafana 默认发的是它自己那套 JSON，而飞书只认
# `{"msg_type":"text","content":{"text":"…"}}` —— 发过去的结果是 HTTP 200 加一个
# 「参数错误」的业务码，也就是说**看起来成功了，但群里什么都不会出现**。
# 这正是 §7.3 说的「没验过的通道与没有告警是一回事」最典型的形态。

apiVersion: 1

contactPoints:
  - orgId: 1
    name: feishu
    receivers:
      - uid: feishu
        type: webhook
        settings:
          url: $FEISHU_WEBHOOK_URL
          httpMethod: POST
          # 自定义正文，套成飞书要的形状。**一行文本里要带上判据本身**：
          # 只说「某某告警触发了」的话，收到的人还得再去翻看板才知道发生了什么
          payload:
            template: |
              {
                "msg_type": "text",
                "content": {
                  "text": "【智能体平台】{{ len .Alerts.Firing }} 条告警触发、{{ len .Alerts.Resolved }} 条恢复\n{{ range .Alerts }}[{{ .Status }}] {{ .Labels.alertname }}{{ if .Annotations.summary }} — {{ .Annotations.summary }}{{ end }}\n{{ end }}"
                }
              }
