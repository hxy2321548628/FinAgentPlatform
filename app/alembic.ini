# 建表与改表的唯一入口（P2 计划 §5 步骤二）。
#
#   cd app && uv run alembic upgrade head
#
# 连接串不写在这里 —— 它带口令，且 compose 与本机跑的主机名不同。
# migration/env.py 从 DatabaseSettings 取，与平台读的是同一份配置。
#
# **checkpoint 那几张表不归它管**：由 LangGraph 的 setup() 自建自迁，
# 手工动过就等着下次升级时冲突。

[alembic]
script_location = %(here)s/migration
version_locations = %(here)s/migration/version
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
