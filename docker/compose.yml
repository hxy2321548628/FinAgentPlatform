# 内网单机部署：nginx + api + worker + broker + postgres + redis，六个服务。
#
#   docker compose -f docker/compose.yml up -d --build
#
# **镜像定义跟着源码走**：应用镜像是 `src/Dockerfile`（api / worker / broker 三个
# 入口共用），边缘镜像是 `web/Dockerfile`（前端构建产物 + nginx）。两个构建上下文
# 就是那两个目录本身，与两端「各自自洽」的包根一致。沙箱镜像不 COPY 任何源码，
# 因此留在本目录（`sandbox.Dockerfile`，由 `make sandbox-image` 单独构建）。
#
# **沙箱容器不在这里声明** —— 它们由 broker 在运行时动态创建与销毁。
#
# **可观测性那一套（OTel Collector / Tempo / Loki / Prometheus / Grafana）与 MinIO
# 已于 2026-08-13 整体撤除**，理由与重新纳入的时机见运维设计 §8.3。撤掉 MinIO 是连带的：
# 产物存储在 0009 就搬走了，此后它只剩 Tempo 与 Loki 两个用户。
# pypi-mirror 定案不做（沙箱零出网）。
#
# **两个数据目录都是宿主机 bind mount，不是卷**：命名卷会被 `docker compose down -v`
# 一并删掉，而那里面正是 P2 要保住的东西 —— checkpoint 一丢，中断的任务就再也接不上。

name: zuel-platform

services:
  nginx:
    # **教师看到的界面就在这个镜像里**：前端在构建阶段编译成静态文件，由这一层
    # 直接发，`/api/` 才转给 api。因此**改了 web/ 的代码要重建它**，不是重启
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 工作目录里的文件由 nginx 直发，因此它要读得到那些字节。**只读**：这个容器
      # 永远不该改动 agent 的产出。容器内挂到固定路径，nginx.conf 才能写死 alias ——
      # 宿主那一侧的路径是变量，配置文件里插值不了
      #
      # **重挂 XFS 之后这个容器必须跟着重启**，与 broker 同一个道理：bind mount 在
      # 容器启动那一刻解析，绑着旧目录时 api 照常回 200 与跳转头，而 nginx 打不开
      # 文件 —— 浏览器收到 404，api 侧却一切正常。实测踩过一次
      - ${SANDBOX_WORKSPACE_ROOT:-/data/sandbox}:/workspace:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ../src
      dockerfile: Dockerfile
    # **迁移只由 api 跑**：worker 归看门狗管，卡死时会自己重启，让它也 upgrade
    # 等于把 DDL 放进一条可能反复重来的路上。checkpoint 那几张表不在这里 ——
    # LangGraph 自己 setup()
    command: sh -c "alembic upgrade head && uvicorn app.api.app:app --host 0.0.0.0 --port 8000"
    env_file:
      - ../.env
    environment:
      BROKER_URL: http://broker:8100
      # 用户名 / 口令 / 库名跟着 env_file 从 .env 走，这里只覆盖主机与端口 ——
      # 整条带口令的 DSN 会逼着走 compose 变量插值，而插值只认 shell 里 export 过的值。
      # 端口也得覆盖：.env 里的 5433 是**宿主机**那一侧的映射端口（躲开系统自带的 5432），
      # 容器网络里 postgres 听的仍是 5432
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      # **只有 nginx 后面才能开**：X-Accel-Redirect 是 nginx 的协议，直接跑 uvicorn
      # 时浏览器只会收到一个空响应。**还要求 nginx 挂到了同一个 workspace 根** ——
      # 只开这个而没挂卷的话，每次下载 nginx 都回 404，而 api 这一侧看起来一切正常
      FILE_DIRECT_SEND: "true"
    # api 也要连得到 MCP server：管理员的「测试连接」走的是这个进程。真实的 MCP
    # 全在校外，用不上这一行；**用得上它的是验收** —— 夹具 MCP 跑在宿主机上，
    # 而容器里的 `localhost` 指的是容器自己。与 worker 那一行同一个理由
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # **不挂 docker.sock，也不挂 workspace** —— 这两条就是 ADR-0004 的全部内容。
    # api 被 agent 生成的内容影响之后，能做的最多是发几个 HTTP 请求给 broker。
    # 拆出 worker 之后它连模型都不碰了：收提问投队列、查状态、把事件转 SSE，就这三件事。
    #
    # 两个存储等 healthcheck 过了再起 api：api 启动时就会体检连接，
    # 抢在 Postgres 初始化完成之前起来只会白白 restart 几轮
    depends_on:
      broker:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ../src
      dockerfile: Dockerfile
    # 不是 HTTP 服务，因此没有 uvicorn，也不开端口
    command: python -m app.worker.main
    # **单副本**。吞吐从来不来自副本数（一次分析绝大部分时间在等模型和等沙箱，
    # 一个进程内并发驱动多个 run 就够，见 WORKER_CONCURRENCY），副本数买的只是
    # 「这个进程出事了怎么办」，而那件事现在由两样东西接住：进程退出靠下面的
    # restart，事件循环卡死靠进程内的看门狗把自己变成退出（worker/watchdog.py）。
    #
    # **healthcheck 顶不了看门狗的班**：compose 的 restart 只认进程退出，
    # 判出 unhealthy 不会重启容器 —— 那是 Swarm 才有的行为。
    env_file:
      - ../.env
    environment:
      BROKER_URL: http://broker:8100
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      # **Langfuse 在这套 compose 之外**（它自己一份 compose，见运维设计 §8.3），
      # 因此容器里既够不着它的服务名，也够不着 `localhost` —— 后者在容器里指的是
      # **容器自己**，那上面没有任何东西监听 3000。
      #
      # 于是与上面三项同一个办法：`.env` 留「直接跑 uvicorn」的值
      # （`http://localhost:3000`），这里覆盖成容器里够得着的那个。
      # **不覆盖的话故障是静默的**：SDK 后台批量上报，连不上不抛异常 ——
      # 分析照常跑完、日志照常写着「追踪已开启」，而 Langfuse 上一条都没有。
      #
      # 端口写死 3000，那是 langfuse 自己 compose 里定死的值。
      # 三项里只覆盖地址：两把密钥在容器内外是同一份，跟着 env_file 走
      LANGFUSE_BASE_URL: http://host.docker.internal:3000
    # 让上面那个名字解析得出来。**没有这一行，那个主机名在容器里根本不存在**
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # **迁移不由 worker 跑**，那是 api 的活。表还没建好时 worker 起来也无妨 ——
    # 它要等到有任务投进来才碰 runs 表
    depends_on:
      broker:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 滚动重启时给优雅停机留出时间：worker 收到 SIGTERM 后不再领新任务，
    # 但会等在跑的 run 结束 —— 一次分析几十分钟，掐掉等于把烧过的 token 扔了。
    # 默认的 10 秒远远不够。
    #
    # **代价是单副本下 make rebuild 会静默一段**：这一个进程排空期间没有别人在领任务。
    # 任务留在 Redis Stream 里不会丢，只是要等；急着发版就先 make down
    stop_grace_period: 30m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB 三项由 .env 直接喂给官方镜像，
    # 与 api 侧读的是同一份，不会出现「建库用 A、连库用 B」
    env_file:
      - ../.env
    environment:
      # 数据落在挂载点的子目录里。直接用挂载点的话，宿主目录里任何一个已有文件
      # 都会让 initdb 以「目录非空」失败
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${POSTGRES_DATA_DIR:-../data/postgres}:/var/lib/postgresql/data
    # 只绑回环：门禁与验收脚本在宿主机上跑，够得着即可，不对内网其他机器开放。
    #
    # **端口写死不插值**：compose 的插值只认 shell 里 export 过的值，而 .env 在仓库根，
    # 两边不是同一份 —— 参数化的结果是「忘了 export 就映射到 5432，而 .env 说 5433」，
    # 于是测试连上了宿主机自带的那个 Postgres，且不会报错。5433 是为了躲开系统自带的 5432
    ports:
      - "127.0.0.1:5433:5432"
    # $$ 是转义，让 compose 把变量原样交给容器里的 shell 去展开
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 事件流与任务队列都在这里。默认的 RDB 快照会丢掉最后一段，
    # 而那一段正是崩溃前后的事件 —— 开 AOF，每秒落盘
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - ${REDIS_DATA_DIR:-../data/redis}:/data
    # 同上，写死不插值
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  broker:
    build:
      context: ../src
      dockerfile: Dockerfile
    command: uvicorn app.broker.app:app --host 0.0.0.0 --port 8100
    # 宿主机上的 `langgraph dev` 需要访问真实 broker；只绑定回环地址，
    # 不把 broker 暴露给局域网或公网。Compose 内部仍使用 `broker:8100`。
    ports:
      - "127.0.0.1:8100:8100"
    env_file:
      - ../.env
    environment:
      # **容器内外必须是同一个路径**：broker 起沙箱时把 workspace 路径交给宿主机的
      # Docker 守护进程，那个路径是在**宿主机**上解析的。两边不一致的话，
      # docker run -v 传过去的是 broker 容器内的路径，宿主机上根本不存在
      SANDBOX_WORKSPACE_ROOT: ${SANDBOX_WORKSPACE_ROOT:-/data/sandbox}
      # 与 workspace 同理，broker 容器内外必须看到同一个绝对路径。
      SKILL_ROOT: ${SKILL_ROOT:-/data/skill}
      # 容器内是 root，xfs_quota 不必再套 sudo
      SANDBOX_QUOTA_COMMAND: xfs_quota
      # broker 容器内当前进程是 root，不显式指定的话沙箱会以 root 跑，
      # agent 写出的文件宿主侧读不了，且症状不指向权限
      SANDBOX_USER: ${SANDBOX_USER:?请设成宿主机上 workspace 的属主，形如 1000:1000}
      # P3 起 broker 也要连 Redis（写操作去重表）。**漏了这一行就会连容器自己的
      # 127.0.0.1**，而症状出现在第一次 delete/edit 上，不指向配置
      REDIS_URL: redis://redis:6379/0
    volumes:
      # 唯一持有它的服务。给的是宿主机 root 权限，因此这个容器里不跑任何
      # 来自 agent 的东西 —— 它只认「哪个会话、做什么操作」
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_WORKSPACE_ROOT:-/data/sandbox}:${SANDBOX_WORKSPACE_ROOT:-/data/sandbox}
      - ${SKILL_ROOT:-/data/skill}:${SKILL_ROOT:-/data/skill}
    # 设 project quota 要 CAP_SYS_ADMIN
    cap_add:
      - SYS_ADMIN
    # **光有 CAP_SYS_ADMIN 不够**：xfs_quota 要打开承载 workspace 的那个块设备，
    # 而容器里默认没有它的设备节点 —— 缺了这一条，它的每条命令都只往 stderr 打
    # 一句 `cannot setup path for mount … No such device` 然后**退出 0**，
    # 于是配额一个都设不上而无人知晓（实测过，见 P4 计划 §8.13.2）。
    # 设备用 `findmnt -no SOURCE --target <workspace 根>` 查，export 给 compose。
    # 默认落在 /dev/null 上：没挂 XFS 的机器本来就不设配额，映射它是无害的空操作
    devices:
      - ${SANDBOX_QUOTA_DEVICE:-/dev/null}:${SANDBOX_QUOTA_DEVICE:-/dev/null}
    # 声明容器网络内的端口；宿主机访问由上面的回环 ports 提供。
    expose:
      - "8100"
    # broker 启动时体检 Redis（写操作去重表），连不上就起不来。等它 healthy 再起，
    # 否则只是靠 restart 反复重来 —— 原来这一条挂在 MinIO 上，而 MinIO 已经撤了
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
