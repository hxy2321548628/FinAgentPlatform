# 远端门禁：在干净环境里把本地 `make all` 原样复跑一遍。
#
# 检查项一律定义在仓库根 Makefile，这里不重复任何 ruff / mypy / pytest 命令 ——
# 复制一份就是给门禁立第二个裁判，改一处必漏另一处。
#
# main 是直推的，事前拦截靠 .githooks/pre-push；本 workflow 兜的是
# hook 未安装、被 --no-verify 绕过、或本机环境与 uv.lock 漂移这三种情况。
name: gate

on:
  push:
    branches: [main]
  # 目前不走 PR 流程，留着是防将来（含 dependabot）开了 PR 却静默漏跑
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest

    # 起真的存储，不让门禁静默跳过。test/store/ 与之后落库的用例连不上时会 skip，
    # 而「跳过的门禁等于没有门禁」—— 凭据与端口跟代码里的默认值一致，
    # 因此这里不必再喂一遍 POSTGRES_DSN / REDIS_URL
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zuel
          POSTGRES_PASSWORD: zuel
          POSTGRES_DB: zuel
        # 映射到 5433，与 deploy/compose.yml 及代码里的默认端口一致
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    # action 一律 pin 到完整版本号：setup-uv 不发布 @v9 这种浮动 major tag，
    # 写了会以 "unable to find version" 失败。升级靠手动改这里。
    steps:
      - uses: actions/checkout@v7.0.1

      # 不需要 actions/setup-python：uv 依 app/.python-version 自行装 3.13
      - name: 安装 uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # 沙箱测试靠镜像是否存在来决定跑还是跳过。不在这里构建，CI 会静默跳过
      # 二十个用例（含「容器停掉后文件工具仍可用」这条核心断言）并照常显示绿灯。
      - name: 构建沙箱镜像
        run: docker build -f deploy/sandbox.Dockerfile -t zuel-sandbox:latest .

      # 无 .env、无 DEEPSEEK_API_KEY，进 CI 的测试一律不得打真实 API
      - name: 门禁
        run: make sync-locked all
