# 反向代理。本期只有 api 一个上游 —— broker 不在这里出现，它只在内部网络上监听。
#
# **SSE 的四条配置一条都不能少**，尤其 proxy_buffering：默认配置会把流式输出
# 全部攒到响应结束才发，教师看到的是一个几分钟不动的界面，然后所有事件一次性涌出。

server {
    listen 80;
    server_name _;

    # **上游地址走变量，不用 upstream 块。**
    #
    # `upstream { server api:8000; }` 只在 nginx 启动时解析一次域名。api 容器一重启
    # 就换了 IP，而 nginx 还拿着旧的 —— 表现是持续 502，直到有人想起来重启 nginx。
    # 架构 §8.4 说滚动重启即可发布，那条要成立，这里就必须每次重新解析。
    #
    # 127.0.0.11 是 Docker 的内嵌 DNS。用变量之后 nginx 不再自动带上原始 URI，
    # 所以每处 proxy_pass 都要显式接 $request_uri（它含查询串）
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream api:8000;
    set $minio_upstream minio:9000;

    # 产物是几百 KB 的图，上传的数据文件可能到几十 MB
    client_max_body_size 64m;

    # ---- 产物直发（P4 计划 §2.1）----
    #
    # api 只做鉴权与标识解析，然后回一个 `X-Accel-Redirect` 指到这里，由 nginx
    # 从 MinIO 取字节发给浏览器 —— **api 进程一个字节都不经手**。原设计是 302 跳
    # 预签名 URL，但那个 host 浏览器够不着：内网无域名，MinIO 不对外暴露端口。
    #
    # **`internal` 是这条 location 的全部安全性**：外部直接请求 /artifact/… 一律 404，
    # 只有 api 鉴权通过后发出的内部重定向进得来。去掉它，任何人知道对象键就能下载。
    #
    # **路径前缀就是桶名**，与 .env 的 MINIO_BUCKET 必须一致。这样预签名 URL 削掉
    # host 之后剩下的 /{桶}/{键}?{签名} 可以原样转给 MinIO —— 一个字符都不改写，
    # 也就没有「nginx 重新编码之后签名对不上」这类问题。
    location /artifact/ {
        internal;
        proxy_pass http://$minio_upstream;
        # 签名把 host 也签进去了，转发时必须原样带上，否则 MinIO 判签名不符
        proxy_set_header Host $minio_upstream;
        # 浏览器的 Cookie 不该跟着流到对象存储去
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        # 产物是二进制流，攒在内存里没有意义
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/runs/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;

        # ---- SSE 四条（架构 §8.4）----
        # 关缓冲：不关的话流式输出全部卡到响应结束
        proxy_buffering off;
        proxy_cache off;
        # 长任务：一次分析几分钟到几十分钟，默认 60s 会在中途掐断
        proxy_read_timeout 3600s;
        # 清掉 Connection 头，避免被当成 keep-alive 之外的语义处理
        proxy_set_header Connection '';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        # 提交分析是立刻返回的，但上传大文件要留够时间
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 成本看板（P4 计划 §7.5）。自包含的一页 HTML，无构建、无框架、无外部请求。
    #
    # **鉴权仍在 api 那一侧**：这一页本身谁都打得开，但它一开口就要 /api/admin/usage，
    # 而那个端点非管理员一律 403。把页面藏起来不是安全措施 —— 数据在端点后面。
    location = /usage.html {
        root /usr/share/nginx/html;
    }

    # /docs 与 /openapi.json：内网调试要用
    location / {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
