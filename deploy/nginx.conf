# 反向代理。本期只有 api 一个上游 —— broker 不在这里出现，它只在内部网络上监听。
#
# **SSE 的四条配置一条都不能少**，尤其 proxy_buffering：默认配置会把流式输出
# 全部攒到响应结束才发，教师看到的是一个几分钟不动的界面，然后所有事件一次性涌出。

server {
    listen 80;
    server_name _;

    # **上游地址走变量，不用 upstream 块。**
    #
    # `upstream { server api:8000; }` 只在 nginx 启动时解析一次域名。api 容器一重启
    # 就换了 IP，而 nginx 还拿着旧的 —— 表现是持续 502，直到有人想起来重启 nginx。
    # 架构 §8.4 说滚动重启即可发布，那条要成立，这里就必须每次重新解析。
    #
    # 127.0.0.11 是 Docker 的内嵌 DNS。用变量之后 nginx 不再自动带上原始 URI，
    # 所以每处 proxy_pass 都要显式接 $request_uri（它含查询串）
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream api:8000;

    # 产出的图是几百 KB，上传的数据文件可能到几十 MB
    client_max_body_size 64m;

    # ---- 工作目录直发 ----
    #
    # api 做完鉴权与路径解析，回一个 `X-Accel-Redirect` 指到这里，字节由 nginx 从
    # 挂进来的 workspace 直接发 —— **api 进程一个字节都不经手**。教师下载一个几百 MB
    # 的 csv 时，占住的是 nginx 的连接而不是 api 的 worker：后者数量少，还要同时
    # 扛所有 SSE 长连接。
    #
    # **`internal` 同样是这条 location 的全部安全性**：外部直接请求 /workspace/… 一律
    # 404。去掉它，任何人猜到会话 id 就能翻别人的工作目录 —— 那些 id 就在 URL 里。
    #
    # **路径由 broker 判过越界**，api 只是把它规范化后的结果转过来。这里不再做第二次
    # 判定：规则跟着目录走，写两遍必然分叉。
    location /workspace/ {
        internal;
        alias /workspace/;
    }

    location /api/runs/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;

        # ---- SSE 四条（架构 §8.4）----
        # 关缓冲：不关的话流式输出全部卡到响应结束
        proxy_buffering off;
        proxy_cache off;
        # 长任务：一次分析几分钟到几十分钟，默认 60s 会在中途掐断
        proxy_read_timeout 3600s;
        # 清掉 Connection 头，避免被当成 keep-alive 之外的语义处理
        proxy_set_header Connection '';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        # 提交分析是立刻返回的，但上传大文件要留够时间
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /docs 与 /openapi.json：内网调试要用
    location / {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
