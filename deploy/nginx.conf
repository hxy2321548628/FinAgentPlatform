# 反向代理。本期只有 api 一个上游 —— broker 不在这里出现，它只在内部网络上监听。
#
# **SSE 的四条配置一条都不能少**，尤其 proxy_buffering：默认配置会把流式输出
# 全部攒到响应结束才发，教师看到的是一个几分钟不动的界面，然后所有事件一次性涌出。

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # 产物是几百 KB 的图，上传的数据文件可能到几十 MB
    client_max_body_size 64m;

    location /api/runs/ {
        proxy_pass http://api;
        proxy_http_version 1.1;

        # ---- SSE 四条（架构 §8.4）----
        # 关缓冲：不关的话流式输出全部卡到响应结束
        proxy_buffering off;
        proxy_cache off;
        # 长任务：一次分析几分钟到几十分钟，默认 60s 会在中途掐断
        proxy_read_timeout 3600s;
        # 清掉 Connection 头，避免被当成 keep-alive 之外的语义处理
        proxy_set_header Connection '';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        # 提交分析是立刻返回的，但上传大文件要留够时间
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /docs 与 /openapi.json：内网调试要用
    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
