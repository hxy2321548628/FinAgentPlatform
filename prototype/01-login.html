<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinAgentPlatform · 登录</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    /* ── 登录页特有布局 ── */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* 登录页 deco 使用 fixed 定位，位置偏移略大 */
    .deco-stamp { position: fixed; }
    .deco-tl { top: 80px; left: 80px; }
    .deco-br { bottom: 80px; right: 80px; }

    .login-wrapper {
      display: flex;
      width: 900px;
      min-height: 540px;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 8px rgba(11,46,92,0.06), 0 20px 60px rgba(11,46,92,0.12);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* 左侧品牌区 */
    .brand-panel {
      width: 380px;
      flex-shrink: 0;
      background: var(--brand);
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 44px;
      position: relative;
      overflow: hidden;
    }
    .brand-panel::before {
      content: '';
      position: absolute;
      right: -60px; top: -60px;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(23,73,196,0.4) 0%, transparent 70%);
      pointer-events: none;
    }
    /* 品牌区 logo 覆盖（深色背景，图标改为白色） */
    .brand-panel .logo { margin-right: 0; }
    .brand-panel .logo-icon span { background: #fff; }
    .brand-panel .logo-text { color: #fff; font-size: 18px; letter-spacing: 0.04em; }

    .brand-content { margin-top: 60px; }
    .brand-tag {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 20px;
    }
    .brand-title { font-size: 34px; font-weight: 900; color: #fff; line-height: 1.2; margin-bottom: 16px; }
    .brand-desc { font-size: 14px; color: rgba(255,255,255,0.55); line-height: 1.75; }
    .brand-stats { display: flex; gap: 32px; }
    .stat-num { font-size: 22px; font-weight: 700; color: #fff; font-family: 'JetBrains Mono', monospace; }
    .stat-label { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.1em; margin-top: 3px; }
    .brand-deco {
      position: absolute; bottom: 40px; right: 30px;
      font-size: 11px; font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.2em; color: rgba(255,255,255,0.1);
      transform: rotate(-45deg); white-space: nowrap;
    }

    /* 右侧表单区 */
    .form-panel {
      flex: 1; padding: 60px 52px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .form-header { margin-bottom: 36px; }
    .form-title { font-size: 26px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
    .form-subtitle { font-size: 14px; color: var(--text-secondary); }

    .tab-bar { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
    .tab-btn {
      padding: 10px 20px; font-size: 14px; font-weight: 500;
      color: var(--text-muted); background: none; border: none;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      cursor: pointer; transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn:hover { color: var(--text-primary); }
    .tab-btn.active { color: var(--action); border-bottom-color: var(--action); }

    .form-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .remember { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
    .remember input { accent-color: var(--action); }
    .forgot { font-size: 13px; color: var(--action); text-decoration: none; cursor: pointer; }
    .forgot:hover { text-decoration: underline; }

    .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--text-muted); font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .form-footer { margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-secondary); }
    .form-footer a { color: var(--action); text-decoration: none; font-weight: 500; }
    .form-footer a:hover { text-decoration: underline; }

    .register-panel { display: none; }
    .login-panel { display: block; }
  </style>
</head>
<body class="grid-bg">
  <div class="deco-stamp deco-tl" id="deco1">ANALYSIS · 09:32</div>
  <div class="deco-stamp deco-br" id="deco2">ANALYSIS · 09:32</div>

  <div class="login-wrapper">
    <!-- 左侧品牌 -->
    <div class="brand-panel">
      <a class="logo" href="#">
        <div class="logo-icon">
          <span></span><span></span><span></span>
        </div>
        <span class="logo-text">FinAgentPlatform</span>
      </a>

      <div class="brand-content">
        <div class="brand-tag">// INTELLIGENCE MINIMAL</div>
        <div class="brand-title">金融学院<br>智能体平台</div>
        <div class="brand-desc">
          提出分析问题，智能体自动编写代码、<br>
          在隔离沙箱中执行，返回结果与图表。
        </div>
      </div>

      <div class="brand-stats">
        <div class="stat-item">
          <div class="stat-num">DeepSeek</div>
          <div class="stat-label">POWERED BY</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">SSE</div>
          <div class="stat-label">STREAM</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">gVisor</div>
          <div class="stat-label">SANDBOX</div>
        </div>
      </div>

      <div class="brand-deco" id="brandDeco">ANALYSIS · 09:32</div>
    </div>

    <!-- 右侧表单 -->
    <div class="form-panel">
      <div class="form-header">
        <div class="form-title">欢迎回来</div>
        <div class="form-subtitle">登录您的 FinAgentPlatform 账户</div>
      </div>

      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('login', this)">登录</button>
        <button class="tab-btn" onclick="switchTab('register', this)">注册</button>
      </div>

      <!-- 登录面板 -->
      <div class="login-panel" id="loginPanel">
        <div class="field">
          <label class="field-label">邮箱地址</label>
          <input class="input" type="email" placeholder="your@company.com" value="analyst@finresearch.io" />
        </div>
        <div class="field">
          <label class="field-label">密码</label>
          <input class="input" type="password" placeholder="请输入密码" value="••••••••" />
        </div>
        <div class="form-row">
          <label class="remember">
            <input type="checkbox" checked /> 记住我
          </label>
          <a class="forgot" href="#">忘记密码？</a>
        </div>
        <button class="btn-dark" onclick="window.location.href='02-home.html'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
          </svg>
          登录系统
        </button>
        <div class="form-footer">
          还没有账户？<a href="#" onclick="switchTabByName('register')">立即注册</a>
        </div>
      </div>

      <!-- 注册面板 -->
      <div class="register-panel" id="registerPanel">
        <div class="field">
          <label class="field-label">用户名</label>
          <input class="input" type="text" placeholder="请输入用户名" />
        </div>
        <div class="field">
          <label class="field-label">邮箱地址</label>
          <input class="input" type="email" placeholder="your@company.com" />
        </div>
        <div class="field">
          <label class="field-label">密码</label>
          <input class="input" type="password" placeholder="至少 8 位字符" />
        </div>
        <div class="field">
          <label class="field-label">确认密码</label>
          <input class="input" type="password" placeholder="再次输入密码" />
        </div>
        <button class="btn-dark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
          创建账户
        </button>
        <div class="form-footer">
          已有账户？<a href="#" onclick="switchTabByName('login')">立即登录</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function updateDecoStamps() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const text = `ANALYSIS · ${hh}:${mm}`;
      document.querySelectorAll('.deco-stamp, .brand-deco').forEach(el => {
        el.textContent = text;
      });
    }
    updateDecoStamps();
    setInterval(updateDecoStamps, 60000);

    function switchTab(name, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (name === 'login') {
        document.getElementById('loginPanel').style.display = 'block';
        document.getElementById('registerPanel').style.display = 'none';
        document.querySelector('.form-title').textContent = '欢迎回来';
        document.querySelector('.form-subtitle').textContent = '登录您的 FinAgentPlatform 账户';
      } else {
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('registerPanel').style.display = 'block';
        document.querySelector('.form-title').textContent = '创建账户';
        document.querySelector('.form-subtitle').textContent = '开始您的智能分析之旅';
      }
    }

    function switchTabByName(name) {
      const btns = document.querySelectorAll('.tab-btn');
      switchTab(name, name === 'login' ? btns[0] : btns[1]);
    }
  </script>
</body>
</html>
