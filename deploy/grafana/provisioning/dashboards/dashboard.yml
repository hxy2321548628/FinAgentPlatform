# 看板同样由配置文件供给，理由与数据源一样：手点出来的东西不进仓库，也就不可 diff。
#
# **所在目录必须叫 `dashboards`（复数）**，与隔壁 datasources 同一个理由：
# 那是 Grafana 写死的查找路径。下面 `options.path` 指向的才是我们自己的目录，
# 那个可以随便叫。

apiVersion: 1

providers:
  - name: zuel
    type: file
    # 界面上改不动。要改就改仓库里的 JSON，让改动跟着提交走
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboard
      foldersFromFilesStructure: false
