# 建表与改表的唯一入口（P2 计划 §5 步骤二）。
#
#   cd app && uv run alembic upgrade head
#
# 连接串不写在这里 —— 它带口令，且 compose 与本机跑的主机名不同。
# migration/env.py 从 StoreSettings 取，与平台读的是同一份配置。
#
# **checkpoint 那几张表不归它管**：由 LangGraph 的 setup() 自建自迁，
# 手工动过就等着下次升级时冲突。
#
# **这里没有 logging 配置**：alembic 的模板默认带一份并在 env.py 里 fileConfig 它，
# 那会把全进程的 logging 重配一遍。日志配置本项目只有一处，即 app/log.py 的 configure()。

[alembic]
script_location = %(here)s/migration
version_locations = %(here)s/migration/version
prepend_sys_path = .
path_separator = os

[post_write_hooks]
